services:
  mysql:
    image: mysql:8.0.36
    container_name: ems-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-employee}
      MYSQL_USER: ${MYSQL_USER:-ems_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD?MYSQL_PASSWORD is required. Set it in your environment or a .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD?MYSQL_ROOT_PASSWORD is required. Set it in your environment or a .env file}
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - ems_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ems-redis

  ems-backend:
    image: ${DOCKER_REGISTRY:-docker.io/monishan8130}/ems-backend:${IMAGE_TAG:-latest}
    build:
      context: ./ems-backend/ems-backend
      dockerfile: Dockerfile
    container_name: ems-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/employee?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:-ems_user}
      DB_PASSWORD: ${MYSQL_PASSWORD?MYSQL_PASSWORD is required. Set it in your environment or a .env file}

      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET?JWT_SECRET is required. Set it in your environment or a .env file}
      JWT_TTL_MS: ${JWT_TTL_MS:-3600000}
      EPF_EMPLOYEE_PERCENT: ${EPF_EMPLOYEE_PERCENT:-8}
      EPF_EMPLOYER_PERCENT: ${EPF_EMPLOYER_PERCENT:-12}

      # Optional: tune JVM
      JAVA_OPTS: -Xms256m -Xmx512m
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8090:8090"

  ems-frontend:
    image: ${DOCKER_REGISTRY:-docker.io/monishan8130}/ems-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./ems-fullstack
      dockerfile: Dockerfile
    container_name: ems-frontend
    depends_on:
      - ems-backend
    ports:
      - "5173:80"

  adminer:
    image: adminer:4
    container_name: ems-adminer
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  ems_mysql_data:
    driver: local
