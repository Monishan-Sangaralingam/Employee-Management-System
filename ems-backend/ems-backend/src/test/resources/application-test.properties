spring.datasource.url=jdbc:h2:mem:ems_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Never create seeded users during tests
CREATE_DEFAULT_USERS=false

# Use a temp dir for uploads in tests
app.upload.dir=${java.io.tmpdir}/ems-test-uploads
