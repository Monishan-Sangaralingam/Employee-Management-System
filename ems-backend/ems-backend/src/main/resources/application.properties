spring.application.name=ems-backend

# Database connection (overridable via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:Monishan}
spring.datasource.password=${DB_PASSWORD:Moni@998130}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.mvc.pathmatch.matching-strategy = ant-path-matcher

server.port=8080

# JWT (overridable via environment variables)
# NOTE: For production, set a strong JWT_SECRET (>= 32 bytes for HS256).
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.ttl-ms=${JWT_TTL_MS:3600000}

# Payroll / EPF (overridable via environment variables)
app.payroll.epf-employee-percent=${EPF_EMPLOYEE_PERCENT:8}
app.payroll.epf-employer-percent=${EPF_EMPLOYER_PERCENT:12}

# File uploads (documents)
app.upload.dir=${UPLOAD_DIR:/data/uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

