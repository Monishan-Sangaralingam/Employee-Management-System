spring.application.name=ems-backend

# Database connection (overridable via environment variables)
# Default is H2 for local/dev so the app can start without MySQL.
# In Docker/production, override via DB_URL/DB_USER/DB_PASSWORD to point at MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:ems;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:}

# Never use 'create' in production. Prefer migrations; for dev 'update' is acceptable.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.show-sql=${SHOW_SQL:false}
# Let Hibernate infer the dialect from JDBC URL.
spring.mvc.pathmatch.matching-strategy = ant-path-matcher

server.port=8090

# JWT (overridable via environment variables)
# NOTE: For production, set a strong JWT_SECRET (>= 32 bytes for HS256).
app.jwt.secret=${JWT_SECRET:dev-jwt-secret-change-me-to-a-long-random-value}
app.jwt.ttl-ms=${JWT_TTL_MS:3600000}

# CORS (comma-separated). In production, set this to your real frontend origin(s).
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}

# Payroll / EPF (overridable via environment variables)
app.payroll.epf-employee-percent=${EPF_EMPLOYEE_PERCENT:8}
app.payroll.epf-employer-percent=${EPF_EMPLOYER_PERCENT:12}

# File uploads (documents)
app.upload.dir=${UPLOAD_DIR:/data/uploads}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:10485760}
app.upload.allowed-mime-types=${UPLOAD_ALLOWED_MIME_TYPES:application/pdf,image/png,image/jpeg}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Demo login / default users (dev/demo only)
# The app can bootstrap a default ADMIN user on startup via DefaultUsersInitializer.
#
# How it works:
# - If CREATE_DEFAULT_USERS=true, the app ensures an admin user exists.
# - Username defaults to 'admin@local' unless DEFAULT_ADMIN_USERNAME is set.
# - Password is taken from DEFAULT_ADMIN_PASSWORD.
#   - If DEFAULT_ADMIN_PASSWORD is NOT set and a prod profile is active, the app refuses to create the user.
#   - If DEFAULT_ADMIN_PASSWORD is NOT set and you're NOT in prod, the app generates a one-time password and logs it.
#
# Recommended: set these as environment variables (or pass via Docker Compose) instead of committing secrets here.
CREATE_DEFAULT_USERS=true
DEFAULT_ADMIN_USERNAME=admin
DEFAULT_ADMIN_PASSWORD=admin@123

# Sample data (dev/demo only)
# Creates a few employees and demo users at startup.
app.sample-data.enabled=true

