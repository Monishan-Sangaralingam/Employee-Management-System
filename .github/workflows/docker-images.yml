name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}
  BACKEND_CONTEXT: ems-backend/ems-backend
  FRONTEND_CONTEXT: ems-fullstack

jobs:

  # ────────────────────────────────────────────
  # 1. Build & Test  (parallel backend + frontend)
  # ────────────────────────────────────────────
  build-test-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build & Test (Maven)
        working-directory: ${{ env.BACKEND_CONTEXT }}
        run: ./mvnw -B -DskipTests=false package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ env.BACKEND_CONTEXT }}/target/surefire-reports/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ${{ env.BACKEND_CONTEXT }}/target/*.jar
          retention-days: 1

  build-test-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_CONTEXT }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_CONTEXT }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.FRONTEND_CONTEXT }}
        run: npm run lint || true

      - name: Unit tests
        working-directory: ${{ env.FRONTEND_CONTEXT }}
        run: npm test

      - name: Build
        working-directory: ${{ env.FRONTEND_CONTEXT }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_CONTEXT }}/dist/
          retention-days: 1

  # ────────────────────────────────────────────
  # 2. Static Analysis  (SonarCloud)
  # ────────────────────────────────────────────
  sonar-analysis:
    name: SonarCloud Analysis
    needs: [ build-test-backend, build-test-frontend ]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Download backend test results
        uses: actions/download-artifact@v4
        with:
          name: backend-test-results
          path: ${{ env.BACKEND_CONTEXT }}/target/surefire-reports/

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ env.BACKEND_CONTEXT }}
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_employee-management-system
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.java.binaries=target/classes
            -Dsonar.junit.reportPaths=target/surefire-reports/

  # ────────────────────────────────────────────
  # 3. Build & Push Docker Images
  # ────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    needs: [ build-test-backend, build-test-frontend ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta.outputs.BACKEND_IMAGE }}
      frontend_image: ${{ steps.meta.outputs.FRONTEND_IMAGE }}
      image_tag: ${{ steps.meta.outputs.TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC=$(echo "${{ env.REPO_OWNER }}" | tr '[:upper:]' '[:lower:]')
          TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/$OWNER_LC/ems-backend" >> $GITHUB_OUTPUT
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/$OWNER_LC/ems-frontend" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BACKEND_CONTEXT }}
          file: ${{ env.BACKEND_CONTEXT }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.BACKEND_IMAGE }}:${{ steps.meta.outputs.TAG }}
            ${{ steps.meta.outputs.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.FRONTEND_CONTEXT }}
          file: ${{ env.FRONTEND_CONTEXT }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.FRONTEND_IMAGE }}:${{ steps.meta.outputs.TAG }}
            ${{ steps.meta.outputs.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ────────────────────────────────────────────
  # 4. Smoke Test  (Compose up, verify health)
  # ────────────────────────────────────────────
  smoke-test:
    name: Docker Smoke Test
    needs: [ docker-build-push ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start stack
        env:
          MYSQL_PASSWORD: smoke_test_pass
          MYSQL_ROOT_PASSWORD: smoke_test_root
          JWT_SECRET: smoke-jwt-secret-min-32-bytes-for-testing
          DOCKER_REGISTRY: ${{ needs.docker-build-push.outputs.backend_image && format('{0}/{1}', env.REGISTRY, needs.docker-build-push.outputs.image_tag) || '' }}
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag || 'latest' }}
        run: docker compose up -d mysql redis ems-backend ems-frontend

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/ 2>/dev/null || echo "000")
            if [ "$code" != "000" ]; then
              echo "✅ Backend responded with HTTP $code"
              exit 0
            fi
            echo "  attempt $i — waiting..."
            sleep 2
          done
          echo "❌ Backend did not respond within 180s"
          docker compose logs ems-backend
          exit 1

      - name: Wait for frontend health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/)
          echo "Frontend HTTP status: $code"
          if echo "$code" | grep -qE "^(200|30[0-9])$"; then
            echo "✅ Frontend OK"
          else
            echo "❌ Frontend did not respond with 2xx/3xx"
            docker compose logs ems-frontend
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ────────────────────────────────────────────
  # 5. Deploy  (SSH to production server)
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [ smoke-test, docker-build-push ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        if: vars.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/ems' }}

            echo "🔑 Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "⬇️  Pulling latest images..."
            docker compose pull

            echo "🚀 Starting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "🩺 Checking health..."
            sleep 10
            docker compose ps

            echo "✅ Deployment complete!"

      - name: Deploy summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ needs.docker-build-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
