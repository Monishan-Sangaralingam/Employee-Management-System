# ========================================================================
#  EMS — Ansible Inventory
#  Update the IP/hostname after Terraform provisions the EC2 instance
# ========================================================================

[app_servers]
ems-app ansible_host=REPLACE_WITH_EC2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ems-keypair.pem

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
