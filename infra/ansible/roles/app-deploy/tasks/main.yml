# ========================================================================
#  Role: app-deploy — Deploy EMS containers via Docker Compose
# ========================================================================
---
- name: Create application directory
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ data_dir }}"

- name: Write .env file
  template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  notify: restart-ems

- name: Write docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: restart-ems

- name: Pull latest images
  command: docker compose pull
  args:
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Start EMS services
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Wait for backend health check
  uri:
    url: "http://localhost:8090/actuator/health"
    method: GET
    status_code: 200
  register: health_check
  retries: 15
  delay: 10
  until: health_check.status == 200
  ignore_errors: true

- name: Report backend health status
  debug:
    msg: "Backend health check: {{ 'HEALTHY' if health_check.status == 200 else 'UNHEALTHY — check logs with: docker compose logs ems-backend' }}"
