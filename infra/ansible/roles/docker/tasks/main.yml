# ========================================================================
#  Role: docker — Ensure Docker + Docker Compose are installed
#  Compatible with EC2 user_data bootstrap (signed-by keyring method)
# ========================================================================
---
# ── Fix any conflicting Docker APT sources first ──────────────────────────
# user_data creates /etc/apt/sources.list.d/docker.list with signed-by.
# A previous Ansible run may have created a second entry without signed-by
# via the deprecated apt_key method. APT refuses to work with both present.

- name: Remove conflicting Docker sources (without signed-by)
  shell: |
    # Remove any docker .list file that does NOT contain 'signed-by'
    for f in /etc/apt/sources.list.d/docker*.list /etc/apt/sources.list.d/download_docker_com*.list; do
      [ -f "$f" ] || continue
      if grep -q 'download.docker.com' "$f" && ! grep -q 'signed-by' "$f"; then
        rm -f "$f"
        echo "Removed conflicting: $f"
      fi
    done
    # Also clean inline entries in sources.list itself
    if grep -q 'download.docker.com' /etc/apt/sources.list 2>/dev/null; then
      sed -i '/download\.docker\.com/d' /etc/apt/sources.list
      echo "Cleaned entries from sources.list"
    fi
    echo "Done"
  args:
    executable: /bin/bash
  changed_when: true

- name: Remove stale Docker apt_key (legacy method)
  shell: apt-key del $(apt-key list 2>/dev/null | grep -B1 -i docker | head -1 | awk '{print $NF}') 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: false
  ignore_errors: true

- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Check if Docker GPG keyring exists
  stat:
    path: /etc/apt/keyrings/docker.gpg
  register: docker_gpg_key

- name: Download Docker GPG key
  shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  when: not docker_gpg_key.stat.exists

- name: Set GPG key permissions
  file:
    path: /etc/apt/keyrings/docker.gpg
    mode: '0644'

- name: Add Docker APT repository (signed-by keyring)
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    state: present
    filename: docker

- name: Install Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: true

- name: Install Docker Python SDK (for Ansible modules)
  pip:
    name:
      - docker
      - docker-compose
    state: present
